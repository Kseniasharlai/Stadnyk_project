<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кулінарний портал</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .recipe-img { object-fit: cover; height: 200px; width: 100%; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'recipes:recipe_list' %}">🍽️ СмачноТут</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                {% if user.is_authenticated %}
                <li class="nav-item">
    <a class="nav-link text-warning" href="{% url 'recipes:recipe_create' %}">➕ Додати рецепт</a>
</li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'recipes:favorites_list' %}">⭐ Обране</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link text-warning">Привіт, <strong>{{ user.username }}</strong>!</span>
                    </li>
                    <li class="nav-item">
                        <form method="POST" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link nav-link">Вийти</button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Увійти</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'recipes:register' %}">Реєстрація</a>
                    </li>
                {% endif %}
            </ul>

            <form class="d-flex" action="{% url 'recipes:recipe_list' %}" method="GET">
                <input class="form-control me-2" type="search" placeholder="Пошук рецептів..." name="q" value="{{ request.GET.q }}">
                <button class="btn btn-outline-light" type="submit">Знайти</button>
            </form>

        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock content %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
