{% extends 'recipes/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow mt-5">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Реєстрація</h2>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Створити акаунт</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
